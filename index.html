<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Videojuego: Atrapa las Estrellas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div>
          <h1>Atrapa las Estrellas</h1>
          <p>Mueve el personaje con las flechas o WASD y captura las estrellas.</p>
        </div>
        <div class="game__stats">
          <div><span>Puntos:</span> <strong id="score">0</strong></div>
          <div><span>Tiempo:</span> <strong id="time">30</strong>s</div>
        </div>
      </header>
      <section class="game__board" aria-live="polite">
        <canvas id="gameCanvas" width="640" height="360" aria-label="Zona de juego"></canvas>
        <div class="game__overlay" id="overlay">
          <h2 id="message">Pulsa iniciar</h2>
          <button id="startButton">Iniciar</button>
        </div>
      </section>
      <footer class="game__footer">
        <p>Reglas rápidas: cada estrella vale 5 puntos. Captura tantas como puedas antes de que el tiempo termine.</p>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
